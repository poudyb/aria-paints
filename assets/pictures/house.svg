  <path class="decor-line" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round" pointer-events="none"
    d="M 460 106 C 446 94 436 86 436 74 C 436 62 448 58 456 66 C 458 68 460 71 460 71 C 460 71 462 68 464 66 C 472 58 484 62 484 74 C 484 86 474 94 460 106 Z"/>

  <!-- ===== Non-paintable decor ===== -->
  <g class="decor-line" fill="none" stroke="#111" stroke-linecap="round" pointer-events="none">
    <!-- Box around the sun -->
    <rect x="28" y="4" width="214" height="176" stroke-width="3.5"/>
    <!-- Attic window cross -->
    <line x1="460" y1="263" x2="460" y2="301" stroke-width="3.5"/>
    <line x1="439" y1="282" x2="481" y2="282" stroke-width="3.5"/>
    <!-- Door knob -->
    <circle cx="552" cy="478" r="5" fill="#111" stroke="none"/>
    <!-- Ground line under the house -->
    <line x1="256" y1="556" x2="700" y2="556" stroke-width="10"/>
  </g>
