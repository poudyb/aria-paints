  <circle id="flowerCenter" class="paint-section" cx="95" cy="362" r="25" fill="#fff"/>
  <circle class="decor-line" cx="95" cy="362" r="25" fill="none" stroke="#111" stroke-width="5" pointer-events="none"/>

