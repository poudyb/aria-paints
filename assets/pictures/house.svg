  <path id="palmFrond3" class="paint-section" fill="#fff"
    d="M 858 236 Q 864 168.2 818 118 Q 812 185.8 858 236 Z"/>
  <path class="decor-line" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round" pointer-events="none"
    d="M 858 236 Q 864 168.2 818 118 Q 812 185.8 858 236 Z"/>
  <path id="palmFrond4" class="paint-section" fill="#fff"
    d="M 858 236 Q 910.1 190.9 912 122 Q 859.9 167.1 858 236 Z"/>
  <path class="decor-line" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round" pointer-events="none"
