  <rect id="houseWall" class="paint-section" x="310" y="340" width="300" height="210" fill="#fff"/>
  <rect class="decor-line" x="310" y="340" width="300" height="210" fill="none" stroke="#111" stroke-width="5" pointer-events="none"/>
  <rect id="windowPane1" class="paint-section" x="348" y="392" width="45" height="44" fill="#fff"/>
  <rect class="decor-line" x="348" y="392" width="45" height="44" fill="none" stroke="#111" stroke-width="4" pointer-events="none"/>
  <rect id="windowPane2" class="paint-section" x="393" y="392" width="45" height="44" fill="#fff"/>
  <rect class="decor-line" x="393" y="392" width="45" height="44" fill="none" stroke="#111" stroke-width="4" pointer-events="none"/>
  <rect id="windowPane3" class="paint-section" x="348" y="436" width="45" height="44" fill="#fff"/>
  <rect class="decor-line" x="348" y="436" width="45" height="44" fill="none" stroke="#111" stroke-width="4" pointer-events="none"/>
  <rect id="windowPane4" class="paint-section" x="393" y="436" width="45" height="44" fill="#fff"/>
  <rect class="decor-line" x="393" y="436" width="45" height="44" fill="none" stroke="#111" stroke-width="4" pointer-events="none"/>
  <rect class="decor-line" x="341" y="385" width="104" height="102" fill="none" stroke="#111" stroke-width="5" pointer-events="none"/>
