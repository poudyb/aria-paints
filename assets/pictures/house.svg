<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" aria-label="House">
  <!-- Hand-authored from the reference line drawing: sun in a box (top-left),
       four-petal flower (bottom-left), house (center), bow with a heart
       (above the house), palm tree (right).

       Structure note: app CSS turns .paint-section strokes into an invisible
       fat tap halo, so every paintable shape is immediately followed by a
       matching non-interactive .decor-line outline. Later shapes cover the
       hidden edges of earlier ones, exactly like layered paper cutouts. -->

  <!-- ===== Sun: exactly 2 paintable elements ===== -->
  <!-- All rays are ONE compound path; the center circle is the second element. -->
  <path id="sunRays" class="paint-section" fill="#fff"
    d="M 127.6 58.8 L 135.0 16.0 L 142.4 58.8 Z M 145.2 59.6 L 167.0 36.6 L 158.0 66.9 Z M 160.1 69.0 L 200.8 54.0 L 167.4 81.8 Z M 168.2 84.6 L 199.0 92.0 L 168.2 99.4 Z M 167.4 102.2 L 200.8 130.0 L 160.1 115.0 Z M 158.0 117.1 L 167.0 147.4 L 145.2 124.4 Z M 142.4 125.2 L 135.0 168.0 L 127.6 125.2 Z M 124.8 124.4 L 103.0 147.4 L 112.0 117.1 Z M 109.9 115.0 L 69.2 130.0 L 102.6 102.2 Z M 101.8 99.4 L 71.0 92.0 L 101.8 84.6 Z M 102.6 81.8 L 69.2 54.0 L 109.9 69.0 Z M 112.0 66.9 L 103.0 36.6 L 124.8 59.6 Z"/>
  <path class="decor-line" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" pointer-events="none"
    d="M 127.6 58.8 L 135.0 16.0 L 142.4 58.8 Z M 145.2 59.6 L 167.0 36.6 L 158.0 66.9 Z M 160.1 69.0 L 200.8 54.0 L 167.4 81.8 Z M 168.2 84.6 L 199.0 92.0 L 168.2 99.4 Z M 167.4 102.2 L 200.8 130.0 L 160.1 115.0 Z M 158.0 117.1 L 167.0 147.4 L 145.2 124.4 Z M 142.4 125.2 L 135.0 168.0 L 127.6 125.2 Z M 124.8 124.4 L 103.0 147.4 L 112.0 117.1 Z M 109.9 115.0 L 69.2 130.0 L 102.6 102.2 Z M 101.8 99.4 L 71.0 92.0 L 101.8 84.6 Z M 102.6 81.8 L 69.2 54.0 L 109.9 69.0 Z M 112.0 66.9 L 103.0 36.6 L 124.8 59.6 Z"/>
  <circle id="sunCenter" class="paint-section" cx="135" cy="92" r="38" fill="#fff"/>
  <circle class="decor-line" cx="135" cy="92" r="38" fill="none" stroke="#111" stroke-width="5" pointer-events="none"/>

